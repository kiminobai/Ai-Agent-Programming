<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1480" viewBox="0 0 1800 1480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#23324a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#607089"/>
    </marker>
    <style>
      .title { font: 700 42px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #12233d; }
      .subtitle { font: 400 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #607089; }
      .node-title { font: 700 23px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #14243d; }
      .node-text { font: 400 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52627a; }
      .small { font: 400 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #69778c; }
      .badge { font: 700 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #ffffff; }
      .edge-label { font: 600 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4f6078; }
      .card { fill: #ffffff; stroke: #d6deea; stroke-width: 2; filter: url(#shadow); }
      .edge { fill: none; stroke: #607089; stroke-width: 3; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #8a98aa; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1480" fill="url(#bg)"/>
  <text x="900" y="66" text-anchor="middle" class="title">并行 Subagents 动态调度流程</text>
  <text x="900" y="102" text-anchor="middle" class="subtitle">Supervisor 拆解任务，按 DAG、权限与预算调度内部子代理，最终统一验证与回答</text>

  <!-- 主流程 -->
  <rect x="610" y="140" width="580" height="105" rx="22" class="card"/>
  <rect x="610" y="140" width="10" height="105" rx="5" fill="#3478e5"/>
  <text x="650" y="183" class="node-title">用户请求</text>
  <text x="650" y="215" class="node-text">用户始终只与当前主管 Agent 对话</text>

  <path d="M900 245 L900 292" class="edge"/>
  <rect x="530" y="295" width="740" height="122" rx="22" class="card"/>
  <rect x="530" y="295" width="10" height="122" rx="5" fill="#3478e5"/>
  <text x="570" y="339" class="node-title">Supervisor 判断任务复杂度</text>
  <text x="570" y="371" class="node-text">简单任务直接处理；复杂任务拆分为职责清晰、上下文最小的子任务</text>
  <text x="570" y="399" class="small">不为了“看起来智能”而过度委派</text>

  <!-- 简单任务旁路 -->
  <path d="M530 356 L320 356 L320 475" class="edge"/>
  <rect x="90" y="475" width="460" height="112" rx="20" class="card"/>
  <rect x="90" y="475" width="10" height="112" rx="5" fill="#18a67e"/>
  <text x="130" y="518" class="node-title">简单任务：主管直接完成</text>
  <text x="130" y="551" class="node-text">不创建子代理，不增加额外 Token 与调度成本</text>
  <rect x="245" y="431" width="150" height="30" rx="15" fill="#18a67e"/>
  <text x="320" y="452" text-anchor="middle" class="badge">简单 / 单步骤</text>

  <!-- DAG 与动态规划 -->
  <path d="M900 417 L900 475" class="edge"/>
  <rect x="610" y="475" width="580" height="128" rx="22" class="card"/>
  <rect x="610" y="475" width="10" height="128" rx="5" fill="#f29a2e"/>
  <text x="650" y="517" class="node-title">任务拆解与 DAG 判断</text>
  <text x="650" y="550" class="node-text">识别依赖关系、写入范围与执行顺序</text>
  <text x="650" y="578" class="small">无依赖进入同一 Wave；有依赖或路径冲突保持串行</text>
  <rect x="825" y="431" width="150" height="30" rx="15" fill="#f29a2e"/>
  <text x="900" y="452" text-anchor="middle" class="badge">复杂 / 可拆分</text>

  <path d="M900 603 L900 652" class="edge"/>
  <rect x="510" y="655" width="780" height="130" rx="22" class="card"/>
  <rect x="510" y="655" width="10" height="130" rx="5" fill="#7a5bd6"/>
  <text x="550" y="697" class="node-title">Dynamic Subagents：运行时生成调度计划</text>
  <text x="550" y="730" class="node-text">从当前角色白名单选择架构、Python、前端、后端或质量专家</text>
  <text x="550" y="758" class="small">未注册 specialistId 会被拒绝；子代理不能递归创建更多子代理</text>

  <!-- 预算侧栏 -->
  <path d="M1290 720 L1392 720" class="edge-dashed"/>
  <rect x="1395" y="620" width="350" height="205" rx="20" class="card"/>
  <rect x="1395" y="620" width="9" height="205" rx="5" fill="#7a5bd6"/>
  <text x="1430" y="661" class="node-title">调度硬边界</text>
  <text x="1430" y="695" class="node-text">单批最多 6 项 · 并发默认 3</text>
  <text x="1430" y="725" class="node-text">最大并发 4 · 单项超时 90 秒</text>
  <text x="1430" y="755" class="node-text">上下文总量 12,000 字符</text>
  <text x="1430" y="785" class="node-text">结果预算默认 12,000 字符</text>

  <!-- 权限分流 -->
  <path d="M900 785 L900 836" class="edge"/>
  <rect x="610" y="838" width="580" height="110" rx="22" class="card"/>
  <text x="900" y="881" text-anchor="middle" class="node-title">只读分析，还是工作区执行？</text>
  <text x="900" y="916" text-anchor="middle" class="node-text">按 Tool 白名单、Thread 模式和副作用风险分流</text>

  <path d="M720 948 L500 1020" class="edge"/>
  <text x="555" y="978" class="edge-label">只读</text>
  <rect x="210" y="1022" width="570" height="122" rx="22" class="card"/>
  <rect x="210" y="1022" width="10" height="122" rx="5" fill="#2c9bb6"/>
  <text x="250" y="1065" class="node-title">dispatch_dynamic_subagents</text>
  <text x="250" y="1098" class="node-text">研究、分析、审核自动进入异步并发池</text>
  <text x="250" y="1126" class="small">禁止写文件、命令副作用和长期记忆写入</text>

  <path d="M1080 948 L1300 1020" class="edge"/>
  <text x="1210" y="978" class="edge-label">执行</text>
  <rect x="1020" y="1022" width="570" height="122" rx="22" class="card"/>
  <rect x="1020" y="1022" width="10" height="122" rx="5" fill="#e15759"/>
  <text x="1060" y="1065" class="node-title">execute_dynamic_subagents</text>
  <text x="1060" y="1098" class="node-text">整批先弹出人工审批，批准后才并发执行</text>
  <text x="1060" y="1126" class="small">每项声明 allowedPaths；重叠写入范围直接拒绝</text>

  <!-- 并发池 -->
  <path d="M495 1144 L495 1180 L790 1180" class="edge"/>
  <path d="M1305 1144 L1305 1180 L1010 1180" class="edge"/>
  <rect x="540" y="1170" width="720" height="130" rx="24" class="card"/>
  <rect x="540" y="1170" width="10" height="130" rx="5" fill="#f29a2e"/>
  <text x="580" y="1212" class="node-title">Async Worker Pool：按并发上限执行当前 Wave</text>
  <text x="580" y="1245" class="node-text">各子代理拥有独立 Prompt、最小上下文、Skill 与 Tool 权限</text>
  <text x="580" y="1273" class="small">单项失败 / 超时彼此隔离；用户停止时 AbortSignal 取消整批未完成任务</text>

  <!-- 聚合与最终输出 -->
  <path d="M900 1300 L900 1340" class="edge"/>
  <rect x="430" y="1342" width="940" height="100" rx="22" class="card"/>
  <rect x="430" y="1342" width="10" height="100" rx="5" fill="#18a67e"/>
  <text x="470" y="1383" class="node-title">结构化回传 → Supervisor 验证、去重、冲突处理 → 最终回答</text>
  <text x="470" y="1416" class="node-text">子代理草稿不直接展示；成功结果保留，失败项降级或由主管决定重试</text>

  <!-- 简单任务汇入最终 -->
  <path d="M320 587 L320 1392 L430 1392" class="edge"/>

  <!-- 底部说明 -->
  <rect x="90" y="1220" width="350" height="150" rx="20" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
  <text x="125" y="1262" class="node-title">状态与界面</text>
  <text x="125" y="1295" class="node-text">subagent_runs 保存运行元数据</text>
  <text x="125" y="1325" class="node-text">子代理不创建独立 Thread</text>
  <text x="125" y="1355" class="node-text">前端只显示聚合进度</text>

  <rect x="1360" y="1220" width="350" height="150" rx="20" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
  <text x="1395" y="1262" class="node-title">隐私与边界</text>
  <text x="1395" y="1295" class="node-text">不展示内部 Prompt 与推理</text>
  <text x="1395" y="1325" class="node-text">不共享完整对话与其他草稿</text>
  <text x="1395" y="1355" class="node-text">最终输出始终由主管负责</text>
</svg>
